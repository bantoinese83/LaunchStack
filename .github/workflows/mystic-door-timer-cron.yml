# Door timer expiry — schedule removed Nov 20, 2026 (was every 5 min and failing,
# burning Actions minutes and flooding email). Run manually via workflow_dispatch
# or move to Vercel/Supabase cron. Secrets: CRON_SECRET, MYSTIC_APP_URL.
name: Mystic door timer cron

on:
  workflow_dispatch:

jobs:
  expire-door-timers:
    runs-on: ubuntu-latest
    steps:
      - name: POST door-timer-expire
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MYSTIC_APP_URL: ${{ secrets.MYSTIC_APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$MYSTIC_APP_URL" ]; then
            echo "Skip: set CRON_SECRET and MYSTIC_APP_URL in GitHub repo secrets."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${MYSTIC_APP_URL%/}/api/mystic/cron/door-timer-expire"
